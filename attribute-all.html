<html>
    <head>
        <title>Attribute All</title>
        <style>
            [class*="div"] {
                background-color: lightblue;
                margin: 10px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Attribute All</h1>
        <div class="first-div">This is first div element</div>
        <div class="second-div">This is second div element</div>
        <div class="third-div">This is third div element</div>
          <div class="third">This is third div element</div>
    </body>
</html>
