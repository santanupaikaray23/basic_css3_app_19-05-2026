<html>
    <head>
        <title>Before Using Text</title>
        <style>
            p::before {
                content: "Welcome ";
            }
            p.message::before {
                content: "Hello, ";
            }
        </style>
    </head>
    <body>
        <h1>Before Using Text</h1>
        <p>Lorem ipsum dolor sit amet, 
            consectetur adipisicing elit. Eos,
             recusandae?</p>
             <p class="message">Lorem ipsum dolor sit amet, consectetur adipisicing elit. 
                Iste numquam quaerat porro ipsa minus delectus dolor maxime laborum in repellendus!</p>
    </body>
</html>
